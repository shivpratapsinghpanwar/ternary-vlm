# Stage 2: projector + ternary-LoRA on the LM. ~20-25 GPU-hours on 2x T4.
model:
  lm_name: microsoft/bitnet-b1.58-2B-4T-bf16
  vision_name: google/siglip2-base-patch16-256
  pixel_shuffle: 2
  projector_hidden: 2048
  lora_r: 32
  lora_alpha: 64
  quantize_act: true
  freeze_vision: true
data:
  name: lmms-lab/LLaVA-OneVision-Data
  subset: sharegpt4v(coco)   # start with one subset; add more via a mixture later
  split: train
  max_samples: 150000       # sharegpt4v(coco) has ~50k rows: this is ~3 epochs (the loader cycles shards per epoch)
  max_len: 512
  seed: 1
  shuffle_buffer: 800
train:
  out_dir: ckpt/stage2
  batch_size: 4             # max_len 512 + r=32 on every linear: batch 4 keeps a T4 under ~12 GB
  grad_accum: 8             # effective 32 per GPU, 64 with DDP on 2 GPUs (same as before)
  lr: 2.0e-4
  wd: 0.0
  warmup: 100
  total_steps: 2300         # 150k samples / 64 per step = 2343 steps: schedule must end with the data, not at 4500
  clip: 1.0
  grad_checkpointing: true
  log_every: 20
  save_every: 50            # ~45 min at stage-2 speed: a stop or cancel costs at most that
  workers: 0               # load in-process: forked streaming workers got OOM-killed on Kaggle
