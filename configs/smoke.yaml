# Stage 0: 30-minute smoke test. Proves the model loads, layers get wrapped, loss decreases, checkpoint resumes.
model:
  lm_name: microsoft/bitnet-b1.58-2B-4T-bf16
  vision_name: google/siglip2-base-patch16-256
  pixel_shuffle: 2
  projector_hidden: 2048
  lora_r: 8
  quantize_act: true
  freeze_vision: true
data:
  name: lmms-lab/LLaVA-ReCap-558K
  split: train
  max_samples: 2000
  max_len: 256
  shuffle_buffer: 800
train:
  out_dir: ckpt/smoke
  batch_size: 4
  grad_accum: 1
  lr: 5.0e-4
  warmup: 10
  total_steps: 100
  grad_checkpointing: true
  log_every: 5
  save_every: 25
  workers: 0               # load in-process: forked streaming workers got OOM-killed on Kaggle
