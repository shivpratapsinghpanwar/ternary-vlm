# Ablation: projector-only on stage-2 data. LM stays frozen ternary (lora_r 0 / lora_mode none), so the
# export is trivially exact; this isolates how much of stage 2's gain comes from adapting the LM at all.
# python train.py --config configs/ablation_projector_only.yaml --init ckpt/stage1/latest.pt
model:
  lm_name: microsoft/bitnet-b1.58-2B-4T-bf16
  vision_name: google/siglip2-base-patch16-256
  pixel_shuffle: 2
  projector_hidden: 2048
  lora_r: 0
  lora_mode: none
  quantize_act: true
  quantize_lm: true
  freeze_vision: true
data:
  name: lmms-lab/LLaVA-OneVision-Data
  subset: sharegpt4v(coco)
  split: train
  max_samples: 150000
  max_len: 512
  seed: 1
train:
  out_dir: ckpt/ablation_projector_only
  batch_size: 8
  grad_accum: 4
  lr: 2.0e-4
  wd: 0.0
  warmup: 100
  total_steps: 4500
  clip: 1.0
  grad_checkpointing: true
  log_every: 20
  save_every: 200
  workers: 2
